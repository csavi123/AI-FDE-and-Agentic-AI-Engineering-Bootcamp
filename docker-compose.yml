# One image, two containers: the FastAPI backend and the Streamlit UI.
services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # reachable only from this machine
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    env_file: .env
    environment:
      API_URL: http://api:8000   # the api container's name on the compose network
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
